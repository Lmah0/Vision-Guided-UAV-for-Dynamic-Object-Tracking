[pytest]
testpaths =
    tests
    backend/gcs/ai/tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

markers =
    performance: marks tests as performance benchmarks (use -m performance to run)
    slow: marks tests that are slow-running, e.g. full FPS pacing sweeps
